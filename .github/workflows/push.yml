name: 'Publish new release 🚀'

on:
  push:
    branches:
      - main
      - alpha
      - beta

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/test.yml
    secrets: inherit

  release:
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: myparcelnl/actions/setup-git-credentials@v6
        id: credentials
        with:
          app-id: ${{ secrets.MYPARCEL_APP_ID }}
          private-key: ${{ secrets.MYPARCEL_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.credentials.outputs.token }}

      - uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true

      - uses: ./.github/actions/build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./apps/demo/dist

      # Not nx release publish: it runs npm view, which npm refuses in a repository whose devEngines names pnpm.
      - name: 'Release'
        env:
          GH_TOKEN: ${{ steps.credentials.outputs.token }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        #language=bash
        run: |
          case "$GITHUB_REF_NAME" in
            next|alpha|beta|rc)
              PREID=(--preid "$GITHUB_REF_NAME")
              TAG=(--tag "$GITHUB_REF_NAME")
              ;;
          esac

          pnpm nx release --skip-publish --yes "${PREID[@]}"

          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
          pnpm -r publish --no-git-checks "${TAG[@]}"

  rebase-prs:
    needs: release
    runs-on: ubuntu-22.04
    steps:
      - uses: myparcelnl/actions/rebase-prs@v6
        with:
          app-id: ${{ secrets.MYPARCEL_APP_ID }}
          private-key: ${{ secrets.MYPARCEL_APP_PRIVATE_KEY }}
          base: ${{ github.ref_name }}
          exclude-drafts: true
          exclude-labels: 'dependencies'

  deploy:
    needs: release
    runs-on: ubuntu-22.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  notify-on-failure:
    needs:
      - test
      - release
      - deploy
    if: always() && contains(needs.*.result, 'failure')
    uses: myparcelnl/actions/.github/workflows/notify-on-failure.yml@v6
    secrets: inherit
