name: '🔸 Run tests 🧪'

on:
  workflow_call:

jobs:
  test:
    name: 'Run unit tests'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true

      - uses: ./.github/actions/build

      - uses: myparcelnl/actions/nx-run-many@v6
        with:
          target: 'test:coverage'
          parallel: '1'

      - uses: myparcelnl/actions/collect-test-results@v6

      - uses: myparcelnl/actions/codecov-coverage@v6
        with:
          files: coverage/*.xml
          token: ${{ secrets.CODECOV_TOKEN }}

      - uses: myparcelnl/actions/codecov-test-results@v6
        with:
          files: junit/*.xml
          token: ${{ secrets.CODECOV_TOKEN }}

  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true

      - uses: ./.github/actions/build

      - uses: myparcelnl/actions/bundlewatch@v6
        with:
          token: ${{ secrets.BUNDLEWATCH_TOKEN }}
